<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takusu — Premium Subscriptions</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04040a;
  --surface: #080812;
  --card: #0b0b18;
  --purple: #7c2de8;
  --purple2: #a855f7;
  --purple3: #6d1fd4;
  --green: #10a37f;
  --green2: #00ffb3;
  --gold: #f5c518;
  --pink: #f472b6;
  --cyan: #22d3ee;
  --orange: #fb923c;
  --text: #ffffff;
  --muted: #7070a0;
  --border: rgba(124,45,232,0.25);
}

* { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
}

/* ─── BACKGROUND LAYERS ─── */
.bg-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

/* Animated purple blobs */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  z-index: 0;
}
.blob1 {
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(124,45,232,0.18) 0%, transparent 70%);
  top: -200px; left: -200px;
  animation: blobDrift1 12s ease-in-out infinite alternate;
}
.blob2 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(16,163,127,0.12) 0%, transparent 70%);
  bottom: -100px; right: -100px;
  animation: blobDrift2 15s ease-in-out infinite alternate;
}
.blob3 {
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(168,85,247,0.1) 0%, transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  animation: blobDrift3 10s ease-in-out infinite alternate;
}

@keyframes blobDrift1 {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(60px,40px) scale(1.1); }
}
@keyframes blobDrift2 {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(-40px,-60px) scale(1.15); }
}
@keyframes blobDrift3 {
  from { transform: translate(-50%,-50%) scale(1); }
  to   { transform: translate(-45%,-55%) scale(1.2); }
}

/* Diagonal slash lines across the whole page */
.slashes {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.slashes::before {
  content: '';
  position: absolute;
  width: 1px;
  height: 200%;
  top: -50%;
  left: 22%;
  background: linear-gradient(180deg, transparent 0%, rgba(124,45,232,0.35) 30%, rgba(0,255,179,0.2) 70%, transparent 100%);
  transform: rotate(18deg);
}
.slashes::after {
  content: '';
  position: absolute;
  width: 1px;
  height: 200%;
  top: -50%;
  right: 22%;
  background: linear-gradient(180deg, transparent 0%, rgba(124,45,232,0.25) 40%, rgba(0,255,179,0.15) 70%, transparent 100%);
  transform: rotate(-18deg);
}

/* Extra slash lines via JS-less approach */
.slash-extra {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.slash-extra::before {
  content: '';
  position: absolute;
  width: 1px;
  height: 200%;
  top: -50%;
  left: 50%;
  background: linear-gradient(180deg, transparent, rgba(100,30,200,0.1), transparent);
  transform: rotate(15deg);
}

/* Scanline effect */
.scanlines {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
}

/* Noise grain */
.grain {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px;
}

/* ─── LAYOUT ─── */
.container {
  max-width: 1140px;
  margin: 0 auto;
  padding: 0 24px;
  position: relative;
  z-index: 2;
}

/* ─── HEADER ─── */
header {
  position: relative;
  z-index: 10;
  padding: 40px 24px 0;
  text-align: center;
  overflow: hidden;
}

/* Big watermark text behind header */
.header-watermark {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -40%);
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(80px, 18vw, 180px);
  letter-spacing: 6px;
  color: transparent;
  -webkit-text-stroke: 1px rgba(124,45,232,0.12);
  pointer-events: none;
  user-select: none;
  white-space: nowrap;
}

.header-inner {
  position: relative;
  z-index: 2;
  padding-bottom: 10px;
}

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(124,45,232,0.12);
  border: 1px solid rgba(124,45,232,0.4);
  color: var(--purple2);
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  padding: 6px 16px;
  border-radius: 100px;
  margin-bottom: 24px;
  animation: badgePulse 2.5s ease-in-out infinite;
}

.live-badge .live-dot {
  width: 6px; height: 6px;
  background: var(--green2);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--green2);
  animation: dotBlink 1.2s ease-in-out infinite;
}

@keyframes badgePulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(124,45,232,0.25); }
  50%      { box-shadow: 0 0 0 8px rgba(124,45,232,0); }
}
@keyframes dotBlink {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.2; }
}

/* LOGO */
.logo-wrap {
  position: relative;
  display: inline-block;
  margin-bottom: 10px;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(72px, 16vw, 130px);
  line-height: 0.9;
  letter-spacing: 4px;
  background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.9) 40%, var(--green2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 30px rgba(0,255,179,0.3));
  animation: logoReveal 0.8s cubic-bezier(0.22,1,0.36,1) both;
}

/* Slash through logo */
.logo-slash {
  position: absolute;
  top: 10%;
  left: -5%;
  width: 110%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}
.logo-slash line {
  stroke: rgba(0,255,179,0.5);
  stroke-width: 2;
  filter: drop-shadow(0 0 6px rgba(0,255,179,0.8));
}

@keyframes logoReveal {
  from { opacity: 0; transform: skewX(-5deg) translateY(20px); }
  to   { opacity: 1; transform: skewX(0) translateY(0); }
}

.tagline {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 10px;
  animation: fadeUp 0.8s 0.2s ease both;
}

/* Stars decoration */
.star-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 16px 0 0;
  color: var(--purple2);
  font-size: 14px;
  letter-spacing: 2px;
}

/* ─── PROMO BANNER ─── */
.promo-banner {
  margin: 40px auto 0;
  max-width: 700px;
  position: relative;
  cursor: pointer;
  animation: fadeUp 0.6s 0.3s ease both;
}

.promo-glow {
  position: absolute;
  inset: -2px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--purple), transparent 50%, var(--purple3));
  z-index: -1;
  filter: blur(3px);
  opacity: 0.7;
  animation: promoGlow 3s ease-in-out infinite alternate;
}
@keyframes promoGlow {
  from { opacity: 0.5; filter: blur(3px); }
  to   { opacity: 0.9; filter: blur(8px); }
}

.promo-inner {
  background: linear-gradient(135deg, rgba(12,8,30,0.95), rgba(8,12,20,0.95));
  border: 1px solid rgba(124,45,232,0.35);
  border-radius: 16px;
  padding: 22px 28px;
  text-align: center;
  transition: transform 0.2s;
}

.promo-banner:hover .promo-inner { transform: translateY(-3px); }

.promo-inner h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 3px;
  color: #fff;
  margin-bottom: 4px;
}
.promo-inner p {
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
}
.promo-btn {
  display: inline-block;
  margin-top: 14px;
  background: linear-gradient(90deg, var(--purple3), var(--purple));
  color: #fff;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  padding: 9px 22px;
  border-radius: 8px;
  text-decoration: none;
  letter-spacing: 2px;
  transition: opacity 0.2s, transform 0.1s;
  box-shadow: 0 4px 20px rgba(124,45,232,0.4);
}
.promo-btn:hover { opacity: 0.85; transform: scale(0.98); }

/* ─── SECTION TITLE ─── */
.section-title-wrap {
  text-align: center;
  margin: 64px 0 36px;
  position: relative;
}

.section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 6px;
  color: var(--purple2);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.section-heading {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(36px, 6vw, 52px);
  letter-spacing: 4px;
  color: #fff;
  line-height: 1;
}

.section-heading span {
  color: transparent;
  -webkit-text-stroke: 1px rgba(0,255,179,0.6);
}

.section-line {
  width: 80px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--purple), var(--green2), transparent);
  margin: 16px auto 0;
}

/* ─── PRODUCTS GRID ─── */
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 22px;
  padding-bottom: 30px;
}

/* ─── PRODUCT CARD ─── */
.product-card {
  position: relative;
  border-radius: 20px;
  text-decoration: none;
  color: var(--text);
  display: block;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), box-shadow 0.3s;
  animation: fadeUp 0.5s ease both;
}

.product-card:nth-child(1) { animation-delay: 0.05s; }
.product-card:nth-child(2) { animation-delay: 0.10s; }
.product-card:nth-child(3) { animation-delay: 0.15s; }
.product-card:nth-child(4) { animation-delay: 0.20s; }
.product-card:nth-child(5) { animation-delay: 0.25s; }
.product-card:nth-child(6) { animation-delay: 0.30s; }
.product-card:nth-child(7) { animation-delay: 0.35s; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Glow border */
.card-border {
  position: absolute;
  inset: 0;
  border-radius: 20px;
  border: 1px solid var(--c-accent, rgba(124,45,232,0.3));
  pointer-events: none;
  z-index: 3;
  transition: border-color 0.3s;
}

.product-card:hover .card-border {
  border-color: var(--c-accent, var(--purple2));
  box-shadow: inset 0 0 30px rgba(124,45,232,0.05);
}

.product-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 40px var(--c-glow, rgba(124,45,232,0.2));
}

/* Card inner */
.card-inner {
  background: linear-gradient(160deg, #0d0d1e 0%, #090912 100%);
  border-radius: 20px;
  overflow: hidden;
  position: relative;
}

/* Top color bar */
.card-bar {
  height: 3px;
  background: linear-gradient(90deg, var(--c-accent, var(--purple)), transparent);
  position: relative;
}
.card-bar::after {
  content: '';
  position: absolute;
  right: 0; top: 0;
  width: 40%;
  height: 100%;
  background: linear-gradient(90deg, transparent, var(--c-accent2, var(--green2)));
}

/* Card watermark */
.card-wm {
  position: absolute;
  bottom: -10px;
  right: -10px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 80px;
  letter-spacing: 2px;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255,255,255,0.04);
  pointer-events: none;
  user-select: none;
  line-height: 1;
}

/* Diagonal slash on card */
.card-slash {
  position: absolute;
  top: 0; right: 60px;
  width: 1px; height: 100%;
  background: linear-gradient(180deg, transparent, var(--c-accent, rgba(124,45,232,0.15)), transparent);
  transform: skewX(-12deg);
  pointer-events: none;
}

.card-content {
  padding: 22px 22px 20px;
  position: relative;
  z-index: 2;
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 14px;
}

.card-icon {
  font-size: 32px;
  line-height: 1;
  filter: drop-shadow(0 0 8px var(--c-accent, rgba(124,45,232,0.6)));
}

.card-badge {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.5px;
  padding: 4px 10px;
  border-radius: 100px;
  background: rgba(0,255,179,0.1);
  border: 1px solid rgba(0,255,179,0.3);
  color: var(--green2);
  white-space: nowrap;
}

.card-badge.hot {
  background: rgba(245,197,24,0.1);
  border-color: rgba(245,197,24,0.3);
  color: var(--gold);
}

.card-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 1.5px;
  color: #fff;
  line-height: 1.05;
  margin-bottom: 14px;
}

.card-features {
  list-style: none;
  margin-bottom: 18px;
}

.card-features li {
  font-size: 12.5px;
  font-weight: 600;
  color: rgba(200,200,230,0.75);
  padding: 4px 0;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  line-height: 1.4;
  letter-spacing: 0.3px;
}

.card-features li .arrow {
  color: var(--c-accent, var(--purple2));
  font-size: 14px;
  flex-shrink: 0;
  margin-top: 1px;
  font-style: normal;
}

/* Price row */
.card-price-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  margin-bottom: 16px;
}

.price-main {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 46px;
  line-height: 1;
  color: var(--c-accent, var(--purple2));
  filter: drop-shadow(0 0 10px var(--c-glow, rgba(124,45,232,0.5)));
}

.price-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-bottom: 4px;
}

.price-usd {
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  color: var(--muted);
}

.price-period {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.5px;
  color: rgba(112,112,160,0.7);
  text-transform: uppercase;
}

/* Buy button */
.buy-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 13px 16px;
  background: linear-gradient(90deg, var(--c-btn1, #1a0d35), var(--c-btn2, #0d1a2a));
  border: 1px solid var(--c-accent, rgba(124,45,232,0.5));
  border-radius: 10px;
  color: #fff;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: background 0.25s, border-color 0.25s, transform 0.1s;
  position: relative;
  overflow: hidden;
}

.buy-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
  transform: translateX(-100%);
  transition: transform 0.5s;
}

.product-card:hover .buy-btn::before {
  transform: translateX(100%);
}

.product-card:hover .buy-btn {
  background: linear-gradient(90deg, var(--c-btn2, #0d1a2a), var(--c-btn1, #1a0d35));
  border-color: var(--c-accent, var(--purple2));
}

.btn-arrow {
  font-size: 18px;
  line-height: 1;
  transition: transform 0.2s;
}
.product-card:hover .btn-arrow { transform: translateX(4px); }

/* ─── GMAIL FOR RENT SECTION ─── */
.gmail-section {
  margin: 64px 0 20px;
  position: relative;
  border-radius: 24px;
  overflow: hidden;
  border: 1px solid rgba(124,45,232,0.4);
  background: linear-gradient(140deg, #0a0418 0%, #06020f 50%, #0b0617 100%);
  box-shadow: 0 0 60px rgba(124,45,232,0.15), inset 0 0 80px rgba(80,20,160,0.08);
}

.gmail-glow-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 50%, rgba(124,45,232,0.22) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 85% 50%, rgba(100,30,200,0.18) 0%, transparent 70%);
  pointer-events: none;
}

.gmail-slash {
  position: absolute;
  width: 1px;
  height: 150%;
  top: -25%;
  background: linear-gradient(180deg, transparent, rgba(124,45,232,0.5), rgba(0,255,179,0.25), transparent);
  pointer-events: none;
}
.gmail-slash-1 { left: 18%; transform: rotate(12deg); }
.gmail-slash-2 { right: 18%; transform: rotate(-12deg); }

.gmail-inner {
  position: relative;
  z-index: 2;
  padding: 48px 32px 40px;
  text-align: center;
}

.gmail-wm {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(80px, 20vw, 200px);
  letter-spacing: 8px;
  color: transparent;
  -webkit-text-stroke: 1px rgba(124,45,232,0.1);
  pointer-events: none;
  user-select: none;
  white-space: nowrap;
  line-height: 1;
}

.gmail-label {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--purple2);
  margin-bottom: 12px;
  animation: badgePulse 2.5s ease-in-out infinite;
}

.gmail-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(56px, 12vw, 110px);
  line-height: 0.92;
  letter-spacing: 4px;
  color: #fff;
  margin-bottom: 18px;
  filter: drop-shadow(0 0 30px rgba(124,45,232,0.5));
  animation: logoReveal 0.7s cubic-bezier(0.22,1,0.36,1) both;
}

.gmail-title-g {
  color: transparent;
  -webkit-text-stroke: 3px #fff;
  filter: drop-shadow(0 0 20px rgba(255,255,255,0.6));
}

.gmail-title-outline {
  color: transparent;
  -webkit-text-stroke: 2px rgba(168,85,247,0.85);
  display: inline-block;
}

.gmail-sub {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 2px;
  color: rgba(200,200,240,0.7);
  text-transform: uppercase;
  margin-bottom: 28px;
}

.gmail-platforms {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-bottom: 32px;
}

.gp-pill {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(124,45,232,0.35);
  border-radius: 10px;
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  color: rgba(220,200,255,0.85);
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
  cursor: default;
}
.gp-pill:hover {
  border-color: var(--purple2);
  background: rgba(124,45,232,0.12);
  transform: translateY(-2px);
}

.gmail-cta-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.gmail-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(90deg, #c9a800, #e8c300, #c9a800);
  background-size: 200% auto;
  color: #0a0800;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 1.5px;
  padding: 15px 32px;
  border-radius: 10px;
  text-decoration: none;
  text-transform: uppercase;
  transition: background-position 0.4s, transform 0.15s, box-shadow 0.2s;
  box-shadow: 0 6px 30px rgba(200,163,0,0.4), 0 0 0 1px rgba(200,163,0,0.3);
  animation: shimmer 3s linear infinite;
}
@keyframes shimmer {
  0% { background-position: 0% center; }
  100% { background-position: 200% center; }
}
.gmail-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 40px rgba(200,163,0,0.5), 0 0 0 1px rgba(200,163,0,0.4);
}
.gmail-btn-icon { font-size: 18px; }

.gmail-limited {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--purple2);
  animation: badgePulse 2.5s ease-in-out infinite;
}

/* ─── PAYMENT SECTION ─── */
.payment-section {
  margin: 60px 0;
  position: relative;
}

.payment-box {
  background: linear-gradient(135deg, rgba(12,8,30,0.9), rgba(8,12,20,0.9));
  border: 1px solid rgba(124,45,232,0.25);
  border-radius: 20px;
  padding: 36px 32px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.payment-box::before {
  content: 'PAYMENT';
  position: absolute;
  bottom: -20px; right: -10px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 120px;
  letter-spacing: 4px;
  color: transparent;
  -webkit-text-stroke: 1px rgba(124,45,232,0.07);
  pointer-events: none;
  user-select: none;
}

.payment-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 4px;
  color: #fff;
  margin-bottom: 6px;
}

.payment-sub {
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 1px;
  margin-bottom: 28px;
}

.payment-pills {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}
